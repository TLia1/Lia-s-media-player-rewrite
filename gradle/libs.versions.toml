# Versions of tools and libraries. Minecraft, loader and per-version mod dependencies
# live in platform/stonecutter.properties.toml instead, because they vary by target.

[versions]
java-release = "21"
errorprone = "2.51.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.3"
spotless = "8.10.4"
palantir-java-format = "2.103.0"
jspecify = "1.0.1"
# The versions Minecraft 1.21.1 ships. Only compiled against; the game provides them.
slf4j = "2.0.9"
gson = "2.10.1"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
jacoco = "0.8.16"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Plugins used by build-logic, declared as libraries so the convention plugins can apply them.
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
